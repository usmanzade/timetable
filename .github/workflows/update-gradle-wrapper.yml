name: Update Gradle Wrapper

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle-update/update-gradle-wrapper-action@v2.1.0
        with:
          repo-token: ${{ secrets.UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          labels: dependencies
